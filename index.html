<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="An interactive Atari 2600 chipset simulator. Watch the 6507 CPU, TIA and RIOT light up as instructions run, and zoom into the ALU, registers and adder.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23101917%22%2F%3E%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%2214%22%20height%3D%2214%22%20rx%3D%222%22%20fill%3D%22none%22%20stroke%3D%22%23ffb423%22%20stroke-width%3D%222%22%2F%3E%3Cpath%20d%3D%22M13%205v4M19%205v4M13%2023v4M19%2023v4M5%2013h4M5%2019h4M23%2013h4M23%2019h4%22%20stroke%3D%22%2335e0d2%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<title>Atari Safari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a working bench. The schematic is the workpiece and fills the left; notes, registers and the TV sit in a rail on the right.
   Colour is used as signal: amber = address, teal = data, pink = control, green = ALU, violet = peripheral chips. */
:root {
  --bg: #e6e9e2; --panel: #f4f5f0; --raise: #ffffff; --ink: #16201d; --mute: #56645f; --line: #c2cac0;
  --wire: #b5beb4; --node: #f9faf6; --nstroke: #93a096;
  --addr: #b46a00; --data: #007a73; --ctl: #b8195a; --alu: #467f00; --chip: #4640c0;
  --flow: #ffffff; --onprimary: #ffffff; --sel: #16201d;
  --f-disp: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090f0e; --panel: #101917; --raise: #16221f; --ink: #e2ece8; --mute: #8aa097; --line: #223430;
    --wire: #263834; --node: #121d1a; --nstroke: #34483f;
    --addr: #ffb423; --data: #35e0d2; --ctl: #ff5f9f; --alu: #a4ec55; --chip: #a3adff;
    --flow: #ffffff; --onprimary: #1a1000; --sel: #e2ece8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090f0e; --panel: #101917; --raise: #16221f; --ink: #e2ece8; --mute: #8aa097; --line: #223430;
  --wire: #263834; --node: #121d1a; --nstroke: #34483f;
  --addr: #ffb423; --data: #35e0d2; --ctl: #ff5f9f; --alu: #a4ec55; --chip: #a3adff;
  --flow: #ffffff; --onprimary: #1a1000; --sel: #e2ece8; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 410px); grid-template-rows: auto minmax(0, 1fr); gap: 12px 16px; padding: 12px 16px; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; min-width: 0; }
.top h1 { font: 700 20px/1 var(--f-disp); letter-spacing: .04em; text-transform: uppercase; margin: 0; white-space: nowrap; }
.top h1 span { color: var(--addr); }
.crumbs { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-bottom: 2px; scrollbar-width: thin; flex: 1 1 320px; }
.crumbs button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--f-disp); letter-spacing: .03em; cursor: pointer; }
.crumbs button:hover { border-color: var(--mute); }
.crumbs button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.left { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.stage-wrap { position: relative; flex: 1 1 auto; min-height: 320px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--bg);
  background-image: radial-gradient(color-mix(in srgb, var(--mute) 22%, transparent) 1px, transparent 1.2px); background-size: 22px 22px; }
#stage { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#stage.drag { cursor: grabbing; }
.zoomctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomctl button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: 600 18px var(--f-mono); cursor: pointer; line-height: 1; }
.legend { position: absolute; left: 10px; top: 10px; display: flex; gap: 12px; flex-wrap: wrap; font: 500 12px var(--f-disp); letter-spacing: .04em; text-transform: uppercase; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; max-width: calc(100% - 70px); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.tip { position: absolute; left: 10px; bottom: 10px; max-width: min(520px, calc(100% - 20px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .15s; }
.tip.on { opacity: 1; }
.tip b { font: 600 14px var(--f-disp); letter-spacing: .03em; }
.hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font: 500 12px var(--f-disp); letter-spacing: .05em; text-transform: uppercase; color: var(--mute); background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; white-space: nowrap; pointer-events: none; transition: opacity .6s; }
.hint.gone { opacity: 0; }

.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.tbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 8px 14px; font: 600 14px var(--f-disp); letter-spacing: .03em; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--mute); }
.btn:focus-visible, .crumbs button:focus-visible, .zoomctl button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--chip); outline-offset: 2px; }
.btn.primary { background: var(--addr); border-color: var(--addr); color: var(--onprimary); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.speed { display: flex; align-items: center; gap: 10px; font: 500 13px var(--f-disp); letter-spacing: .03em; flex: 1 1 260px; min-width: 0; }
.speed input[type=range] { flex: 1 1 100px; min-width: 80px; accent-color: var(--addr); }
.speed output { min-width: 84px; font-family: var(--f-mono); font-size: 12px; color: var(--mute); }
.chk { display: flex; align-items: center; gap: 8px; font: 500 13px var(--f-disp); letter-spacing: .03em; }
.chk input { accent-color: var(--addr); width: 16px; height: 16px; }

.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; overflow-y: auto; padding-right: 2px; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px 14px; min-width: 0; }
.card h2 { font: 600 12px var(--f-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 0 0 8px; }
.ins { font: 600 20px/1.2 var(--f-mono); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.ins small { font: 500 13px var(--f-body); color: var(--mute); }
.steps { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; counter-reset: s; }
.steps li { position: relative; padding: 6px 8px 6px 34px; border-radius: 8px; font-size: 13px; color: var(--mute); counter-increment: s; }
.steps li::before { content: counter(s); position: absolute; left: 8px; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--line); color: var(--ink); font: 600 11px/18px var(--f-mono); text-align: center; }
.steps li.done { color: var(--ink); }
.steps li.cur { background: color-mix(in srgb, var(--addr) 16%, var(--panel)); color: var(--ink); }
.steps li.cur::before { background: var(--addr); color: var(--onprimary); }
.empty { color: var(--mute); margin: 0; }
.regs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.reg { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.reg span { display: block; font: 500 11px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.reg b { font: 600 17px var(--f-mono); font-variant-numeric: tabular-nums; }
.flagrow { display: flex; gap: 4px; margin-top: 8px; }
.flagrow i { flex: 1; text-align: center; font: 600 12px/22px var(--f-mono); border-radius: 6px; border: 1px solid var(--line); color: var(--mute); font-style: normal; }
.flagrow i.on { background: var(--data); border-color: var(--data); color: var(--onprimary); }
.tv { position: relative; margin-top: 12px; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--line); }
.tv canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.beam { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #000, 0 0 10px 3px #fff; pointer-events: none; }
.tvnote { font-size: 12px; color: var(--mute); margin: 8px 0 0; }
.part h3 { margin: 0 0 4px; font: 600 17px var(--f-disp); letter-spacing: .02em; }
.part p { margin: 0; }
.chipk { display: inline-block; font: 600 11px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; margin-bottom: 8px; }
details.prog summary { cursor: pointer; font: 600 12px var(--f-disp); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); list-style: none; display: flex; justify-content: space-between; }
details.prog summary::after { content: "+"; font-family: var(--f-mono); }
details.prog[open] summary::after { content: "\2212"; }
.prog .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
.prog select { flex: 1 1 160px; min-width: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
.prog textarea { width: 100%; min-height: 260px; resize: vertical; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 13px/1.5 var(--f-mono); tab-size: 8; white-space: pre; overflow: auto; }
.prog .blurb { margin: 0 0 6px; color: var(--mute); font-size: 13px; }
.err { color: var(--ctl); font: 500 13px var(--f-mono); margin: 6px 0 0; white-space: pre-wrap; }
.listing { margin-top: 10px; max-height: 240px; overflow: auto; font: 12px/1.6 var(--f-mono); border: 1px solid var(--line); border-radius: 10px; background: var(--raise); }
.listing div { display: grid; grid-template-columns: 52px 78px 1fr; gap: 8px; padding: 0 10px; white-space: pre; }
.listing div.cur { background: color-mix(in srgb, var(--addr) 20%, transparent); }
.listing .a { color: var(--mute); }
.listing .b { color: var(--data); }


/* toy die */
#die { opacity: min(1, calc(var(--diea, 0) * 1.7)); }
#die .die-body { fill: color-mix(in srgb, var(--panel) 55%, #222c2a); stroke: var(--nstroke); stroke-width: 4; }
#die .die-edge { fill: none; stroke: color-mix(in srgb, var(--ink) 18%, transparent); stroke-width: 2; }
#die .die-wire { fill: none; stroke: color-mix(in srgb, var(--ink) 45%, transparent); stroke-width: 2.2; stroke-linecap: round; }
#die .die-metal { fill: none; stroke: color-mix(in srgb, var(--ink) 16%, transparent); stroke-width: 1.3; }
#die .mk-b { fill: none; stroke: color-mix(in srgb, var(--ink) 50%, transparent); stroke-width: 2.5; }
#die .mk-t { font: 700 28px var(--f-mono); fill: color-mix(in srgb, var(--ink) 70%, transparent); letter-spacing: .06em; }
#die .mk-r { font: 600 15px var(--f-mono); fill: color-mix(in srgb, var(--ink) 50%, transparent); letter-spacing: .3em; }
#die .die-pad { fill: color-mix(in srgb, var(--addr) 60%, var(--node)); stroke: var(--nstroke); stroke-width: 1.5; }
.dregion { cursor: pointer; }
.dregion .dr-b { fill: color-mix(in srgb, var(--kc) calc(8% + var(--h, 0) * 34%), var(--node)); stroke: color-mix(in srgb, var(--kc) calc(35% + var(--h, 0) * 65%), var(--nstroke)); stroke-width: 3; }
.dregion.lit { filter: drop-shadow(0 0 12px color-mix(in srgb, var(--kc) 70%, transparent)); }
.dregion .dp { fill: color-mix(in srgb, var(--kc) calc(28% + var(--h, 0) * 50%), transparent); }
.dregion .dp2 { fill: color-mix(in srgb, var(--ink) 20%, transparent); }
.dregion .dp3 { fill: color-mix(in srgb, var(--kc) calc(30% + var(--h, 0) * 45%), transparent); }
.dregion .dr-l { font: 700 26px var(--f-disp); fill: var(--ink); letter-spacing: .03em; paint-order: stroke; stroke: var(--node); stroke-width: 6px; }
.dregion .dr-c { font: 500 16px var(--f-body); fill: var(--mute); paint-order: stroke; stroke: var(--node); stroke-width: 5px; }
#stage .cpuel { opacity: max(0, calc(1 - var(--diea, 0) * 1.7)); }
#stage .frame[data-id="f_cpu"] .fb { fill: transparent; }
#stage.dieon .cpuel { pointer-events: none; }
.dietoggle { font: 600 12px var(--f-disp); letter-spacing: .06em; margin-left: auto; }

/* schematic */
#stage text { font-family: var(--f-disp); }
.frame .fb { fill: color-mix(in srgb, var(--panel) 62%, transparent); stroke: color-mix(in srgb, var(--kc, var(--chip)) calc(var(--h, 0) * 100%), var(--nstroke)); stroke-width: 3.5; }
.frame { cursor: pointer; }
.frame .ft { font: 700 28px var(--f-disp); letter-spacing: .06em; fill: var(--ink); }
.frame .fs { font: 500 20px var(--f-disp); letter-spacing: .04em; fill: var(--mute); }
.edge { pointer-events: none; }
.edge .w { fill: none; stroke: var(--wire); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
.edge.thick .w { stroke-width: 7; }
.edge .g { fill: none; stroke: var(--kc); stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; opacity: var(--h, 0); }
.edge.thick .g { stroke-width: 9; }
.edge .f { fill: none; stroke: var(--flow); stroke-width: 3; stroke-dasharray: 10 20; stroke-linecap: round; stroke-linejoin: round; opacity: calc(var(--h, 0) * .85); animation: flow .55s linear infinite; }
.edge.rev .f { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -30; } }
.edge.lit .g { filter: drop-shadow(0 0 5px var(--kc)); }
.k-addr { --kc: var(--addr); } .k-data { --kc: var(--data); } .k-ctl { --kc: var(--ctl); } .k-alu { --kc: var(--alu); } .k-chip { --kc: var(--chip); }
.node { cursor: pointer; }
.node .nb { fill: color-mix(in srgb, var(--kc) calc(var(--h, 0) * 24%), var(--node)); stroke: color-mix(in srgb, var(--kc) calc(30% + var(--h, 0) * 70%), var(--nstroke)); stroke-width: 3; }
.node.lit { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--kc) 65%, transparent)); }
.node.sel .nb, .frame.sel .fb { stroke: var(--sel); stroke-width: 5; stroke-dasharray: 14 8; }
.nl { font: 600 24px var(--f-disp); letter-spacing: .02em; fill: var(--ink); }
.ns { font: 400 17px var(--f-body); fill: var(--mute); }
.nv { font: 600 34px var(--f-mono); fill: var(--ink); }
.nv.top { font-size: 26px; }
.sm { font: 500 15px var(--f-mono); fill: var(--mute); }
.smv { font: 600 20px var(--f-mono); fill: var(--ink); }
.cellb { fill: color-mix(in srgb, var(--kc) calc(var(--h, 0) * 45%), var(--node)); stroke: color-mix(in srgb, var(--kc) calc(30% + var(--h, 0) * 70%), var(--nstroke)); stroke-width: 2; }
.d1 { opacity: var(--d1, 1); }
.d2 { opacity: var(--d2, 0); }
.el { font: 600 20px var(--f-mono); fill: var(--mute); pointer-events: none; }
.flg { fill: var(--node); stroke: var(--nstroke); stroke-width: 2; }
.flg.on { fill: var(--data); stroke: var(--data); }
.flt { font: 600 17px var(--f-mono); fill: var(--mute); text-anchor: middle; }
.flt.on { fill: var(--onprimary); }
.pip { fill: var(--node); stroke: var(--nstroke); stroke-width: 2.5; }
.pip.done { fill: color-mix(in srgb, var(--ctl) 45%, var(--node)); stroke: var(--ctl); }
.pip.now { fill: var(--ctl); stroke: var(--ctl); }
.bigmn { font: 700 46px var(--f-mono); fill: var(--ink); }
.romcur { fill: color-mix(in srgb, var(--kc) calc(15% + var(--h, 0) * 70%), transparent); stroke: var(--chip); stroke-width: 2.5; }
.pill { fill: var(--node); stroke: var(--nstroke); stroke-width: 2; }

@media (max-width: 900px) {
  #app { display: block; height: auto; min-height: 100%; padding: 10px 16px 24px; }
  .top { margin-bottom: 10px; }
  .stage-wrap { height: 62vh; min-height: 320px; flex: none; }
  .left { gap: 10px; }
  .side { overflow: visible; margin-top: 12px; }
  .legend { display: none; }
  .hint { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .edge .f { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Atari <span>Safari</span></h1>
    <nav class="crumbs" id="crumbs" aria-label="Zoom to a part"></nav>
  </header>
  <div class="left">
    <div class="stage-wrap">
      <svg id="stage" role="img" aria-label="Schematic of the Atari 2600 CPU, TIA video chip, RIOT and cartridge. Wires light up as each instruction executes." xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend" aria-hidden="true"><span><i style="background:var(--addr)"></i>address</span><span><i style="background:var(--data)"></i>data</span><span><i style="background:var(--ctl)"></i>control</span><span><i style="background:var(--alu)"></i>ALU</span></div>
      <div class="zoomctl"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">&minus;</button><button id="zFit" aria-label="Fit whole system" style="font-size:12px">FIT</button></div>
      <div class="tip" id="tip"></div>
      <div class="hint" id="hint">Tap a block to zoom in. Drag to pan.</div>
    </div>
    <div class="transport">
      <div class="tbtns">
        <button class="btn primary" id="bRun"></button>
        <button class="btn" id="bStep"></button>
        <button class="btn" id="bMicro"></button>
        <button class="btn" id="bReset"></button>
      </div>
      <label class="speed" for="speed">Speed <input type="range" id="speed" min="0" max="4" step="1" value="1"><output id="speedOut" for="speed"></output></label>
      <label class="chk" for="follow"><input type="checkbox" id="follow"> Follow the action</label>
    </div>
  </div>
  <aside class="side">
    <section class="card" aria-live="polite"><h2>Now executing</h2><div id="now"></div></section>
    <section class="card"><h2>Machine state</h2>
      <div class="regs" id="regs"></div><div class="flagrow" id="flagrow"></div>
      <div class="tv"><canvas id="tv" width="160" height="192" aria-label="Television picture drawn by the TIA"></canvas><div class="beam" id="beam"></div></div>
      <p class="tvnote" id="tvnote">TV output. The white dot is the electron beam.</p>
    </section>
    <section class="card part" id="part"></section>
    <section class="card"><details class="prog" id="progd"><summary>Program</summary>
      <div class="row"><select id="demoSel" aria-label="Choose a demo program"></select><button class="btn" id="bAsm">Assemble and reset</button></div>
      <p class="blurb" id="blurb"></p>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Assembly source"></textarea>
      <div class="err" id="err"></div>
      <div class="listing" id="listing" aria-label="Assembled listing"></div>
    </details></section>
  </aside>
</div>
<script>
/* Atari 2600 core: 6507 CPU + TIA (video) + RIOT (6532) + 4K cartridge.
   The CPU records a datapath trace (this.tr) for the visualiser. */
(function (root) {
'use strict';

const FC = 1, FZ = 2, FI = 4, FD = 8, FB = 16, FU = 32, FV = 64, FN = 128;

const MODE_LEN = { imp: 1, acc: 1, imm: 2, zp: 2, zpx: 2, zpy: 2, izx: 2, izy: 2, rel: 2, abs: 3, abx: 3, aby: 3, ind: 3 };
const DEF = {
  ADC: { imm: 0x69, zp: 0x65, zpx: 0x75, abs: 0x6D, abx: 0x7D, aby: 0x79, izx: 0x61, izy: 0x71 },

VSYNC  = $00
VBLANK = $01
WSYNC  = $02
COLUP0 = $06
COLUPF = $08
COLUBK = $09
CTRLPF = $0A
PF0    = $0D
PF1    = $0E
PF2    = $0F
RESP0  = $10
GRP0   = $1B

start:  SEI
        CLD
        LDX #$FF
        TXS
        LDA #$0E
        STA COLUPF      ; white playfield
        LDA #$1E
        STA COLUP0      ; yellow player
        LDA #$3C
        STA GRP0        ; player shape
        LDA #$01
        STA CTRLPF      ; mirror the playfield
        LDA #$50
        STA PF0
        LDA #$AA
        STA PF1
        LDA #$0F
        STA PF2
        STA WSYNC       ; start of a scanline
        LDX #$06
pos:    DEX
        BNE pos         ; burn cycles to choose the x position
        STA RESP0       ; strobe: the player lands here

frame:  LDA #$02
        STA VSYNC       ; vertical sync on
        STA VBLANK
        STA WSYNC
        STA WSYNC
        STA WSYNC
        LDA #$00
        STA VSYNC       ; vertical sync off
        LDX #37
vb:     STA WSYNC
        DEX
        BNE vb          ; 37 blank lines
        STA VBLANK      ; picture on
        LDX #192
        LDY #$00
line:   STA WSYNC       ; wait for the start of the line
        STY COLUBK      ; background colour for this line
        INY
        INY
        DEX
        BNE line
        LDA #$02
        STA VBLANK      ; picture off
        LDX #29
os:     STA WSYNC
        DEX
        BNE os          ; overscan
        JMP frame
` }
];

/* Turns a machine trace into animation phases.
   phase = { on:[[id, startFraction, reversed]], sets:[[fraction, displayChanges]], text, focus, dur, cyc, kind } */
(function (root) {
const hex2 = v => (v & 255).toString(16).toUpperCase().padStart(2, '0');
const hex4 = v => (v & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');

const CHIP_NAME = { rom: 'cartridge ROM', tia: 'TIA', ram: 'RIOT RAM', timer: 'RIOT timer', io: 'RIOT I/O' };
const CHIP_VIEW = { rom: 'rom', tia: 'tia', ram: 'ram', timer: 'riot', io: 'riot' };
const CHIP_ADDR = { tia: ['e_a_tia'], rom: ['e_a_up', 'e_a_rom'], ram: ['e_a_up', 'e_a_riot'], timer: ['e_a_up', 'e_a_riot'], io: ['e_a_up', 'e_a_riot'] };
const CHIP_DATA = { rom: ['e_d_low', 'e_d_mid'], tia: ['e_d_tia', 'e_d_up'], ram: ['e_lbus_ram', 'e_d_riot', 'e_d_mid'], timer: ['e_lbus_timer', 'e_d_riot', 'e_d_mid'], io: ['e_lbus_io', 'e_d_riot', 'e_d_mid'] };
function chipNodes(chip, addr) {
  switch (chip) {
    case 'rom': return ['f_rom', 'rom_arr', 'romcur'];
    case 'tia': return ['f_tia', 'tia_dec', 'e_tia_dec_regs', 'tia_regs'];
    case 'ram': return ['f_riot', 'riot_dec', 'e_dec_ram', 'riot_ram', 'ram_' + (addr & 0x7F)];
    case 'timer': return ['f_riot', 'riot_dec', 'e_dec_timer', 'riot_timer'];
    default: return ['f_riot', 'riot_dec', 'e_dec_timer', 'e_tim_io', 'riot_io'];
  }
}
const TIA_EXTRA = (reg) => {
  if (!reg) return [];
  if (reg === 'WSYNC') return ['e_regs_wsync', 'tia_wsync'];
  if (/^RES/.test(reg)) return ['e_regs_gen', 'tia_gen', 'e_clk_gen', 'tia_clk'];
  if (/^COL/.test(reg)) return ['e_regs_mux', 'tia_mux', 'e_mux_out', 'tia_out'];
  if (/^(PF|GRP|NUSIZ|CTRLPF|REFP|ENA|ENAB)/.test(reg)) return ['e_regs_gen', 'tia_gen'];
  if (/^(VSYNC|VBLANK)/.test(reg)) return ['e_mux_out', 'tia_out'];
  return [];
};

/* address then data, in either direction, staggered over the phase */
function accessOn(on, chip, addr, dir, t0) {
  const add = (id, t, rev) => on.push([id, t, !!rev]);
  add('ar', t0); add('e_ar_pin', t0 + 0.05);
  CHIP_ADDR[chip].forEach((id, i) => add(id, t0 + 0.12 + i * 0.04));
  chipNodes(chip, addr).forEach((id, i) => add(id, t0 + 0.28 + i * 0.02));
  const d = CHIP_DATA[chip];
  if (dir === 'r') {
    d.forEach((id, i) => add(id, t0 + 0.5 + i * 0.05, true));
    add('e_data_pin', t0 + 0.5 + d.length * 0.05, true);
    add('buf', t0 + 0.7); add('e_db_buf', t0 + 0.75, true); add('e_db', t0 + 0.8, true);
  } else {
    add('e_db', t0 + 0.4); add('e_db_buf', t0 + 0.45); add('buf', t0 + 0.5); add('e_data_pin', t0 + 0.55);
    d.slice().reverse().forEach((id, i) => add(id, t0 + 0.62 + i * 0.05));
  }
}
function ripple(a, b, c) {
  const cs = []; let res = 0;
  for (let i = 0; i < 8; i++) {
    const ai = (a >> i) & 1, bi = (b >> i) & 1; const s = ai ^ bi ^ c, co = (ai & bi) | (ai & c) | (bi & c);
    res |= s << i; c = co; cs.push(co);
  }
  return { res, cs };
}
function adderOn(on, cs, t0, span, cin) {
  const add = (id, t, rev) => on.push([id, t, !!rev]);
  if (cin) { add('p', t0 - 0.1); add('e_p_cin', t0 - 0.05); add('k_in', t0); }
  for (let b = 0; b < 8; b++) {
    const t = t0 + span * b / 8;
    add('cell' + b, t);
    if (cs[b]) add('k' + b, t + span / 16);
  }
}
const REGN = { a: 'A', x: 'X', y: 'Y', s: 'S', p: 'P' };
const flagsTxt = fl => fl ? ' Flags ' + fl.split('').join(' ') + ' updated.' : '';

function buildPhases(info, tr) {
  const phases = []; let cyc = 0;
  const mode = info.mode;
  for (let i = 0; i < tr.length; i++) {
    const e = tr[i], nxt = tr[i + 1];
    const on = [], sets = []; let text = '', focus = 'cpu', dur = 1, kind = 'cpu';
    const add = (id, t, rev) => on.push([id, t, !!rev]);
    switch (e.t) {
      case 'fetch': {
        cyc++; focus = 'cpu'; kind = 'fetch';
        add('pc', 0); add('e_pc_ar', 0.05); add('ar', 0.1);
        accessOn(on, e.chip, e.addr, 'r', 0);
        add('e_pc_inc', 0.3); add('inc', 0.36); add('e_inc_pc', 0.42);
        sets.push([0, { ar: e.addr }], [0.45, { pc: e.set.pc }], [0.6, { db: e.val }]);
        if (e.chip === 'rom') sets.push([0.28, { romAddr: e.addr & 0xFFF }]);
        if (e.kind === 'op') {
          add('e_db_ir', 0.86); add('ir', 0.9); add('e_ir_dec', 0.93); add('dec', 0.95); add('tim', 0.97);
          sets.push([0.9, { ir: e.val, opinfo: true }]);
          text = 'Fetch the opcode $' + hex2(e.val) + ' from $' + hex4(e.addr) + '. It goes into the instruction register and the decoder takes over.';
        } else {
          if (mode === 'rel') { add('e_db_alub', 0.86); add('bin', 0.92); }
          else if (mode !== 'imm') { add('e_db_ar', 0.86); }
          text = 'Fetch operand byte $' + hex2(e.val) + ' from $' + hex4(e.addr) + (mode === 'imm' ? '. It is the value itself.' : mode === 'rel' ? '. It is the branch offset.' : '. It is part of an address.');
        }
        break;

  tip.innerHTML = ''; const b = document.createElement('b'); b.textContent = i.label; tip.append(b, ' ' + i.desc.split('. ')[0].replace(/\.$/, '') + '.');
  tip.classList.add('on');
}
svg.addEventListener('pointerleave', () => tip.classList.remove('on'));

/* ================= program ================= */
let listingEls = new Map(), hiPC = -1;
function loadRomFromSource(src) {
  const r = A.assemble(src), err = $('#err');
  if (r.errors.length) { err.textContent = r.errors.map(e => 'Line ' + e.ln + ': ' + e.msg).join('\n'); return false; }
  err.textContent = '';
  M.loadRom(r.rom); romVer++;
  const L = $('#listing'); L.innerHTML = ''; listingEls = new Map();
  r.listing.forEach(l => {
    const d = document.createElement('div');
    const a = document.createElement('span'); a.className = 'a'; a.textContent = hex4(l.addr);
    const b = document.createElement('span'); b.className = 'b'; b.textContent = l.bytes.map(hex2).join(' ');
    const t = document.createElement('span'); t.textContent = l.text;
    d.append(a, b, t); L.appendChild(d); if (!listingEls.has(l.addr)) listingEls.set(l.addr, d);
  });
  resetMachine();
  return true;
}
function highlightPC(pc) {
  if (pc === hiPC) return;
  const o = listingEls.get(hiPC); if (o) o.classList.remove('cur');
  hiPC = pc; const n = listingEls.get(pc); if (n) { n.classList.add('cur'); const L = $('#listing'); if (L.scrollHeight > L.clientHeight) L.scrollTop = n.offsetTop - L.clientHeight / 2; }
}

/* ================= panels ================= */
const nowBox = $('#now');
let rtNote = false;
function renderNow() {
  rtNote = false;
  nowBox.innerHTML = '';
  if (!cur) {
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = 'Press Run to watch the program, or Step to execute one instruction at a time. Micro-step pauses after every bus cycle.';
    nowBox.appendChild(p); return;
  }
  const h = document.createElement('div'); h.className = 'ins';
  const a = document.createElement('span'); a.textContent = '$' + hex4(cur.info.pc) + '  ' + cur.text;
  const s = document.createElement('small'); s.textContent = (INS_DESC[cur.info.m] || 'Unofficial opcode') + ' · ' + cur.info.cycles + ' cycles · ' + cur.info.len + (cur.info.len > 1 ? ' bytes' : ' byte');
  h.append(a, s); nowBox.appendChild(h);
  const ol = document.createElement('ol'); ol.className = 'steps';
  cur.phases.forEach(p => { const li = document.createElement('li'); li.textContent = p.text; ol.appendChild(li); });
  nowBox.appendChild(ol); cur.ol = ol;
}
function markStep(idx) {
  if (!cur || !cur.ol) return;
  [...cur.ol.children].forEach((li, i) => { li.classList.toggle('done', i < idx); li.classList.toggle('cur', i === idx); });
  const li = cur.ol.children[idx]; if (li) cur.ol.scrollTop = li.offsetTop - cur.ol.clientHeight / 2 + li.offsetHeight / 2;
}
const regsEl = $('#regs'), regCells = {};
[['PC', 'pc'], ['A', 'a'], ['X', 'x'], ['Y', 'y'], ['S', 's'], ['P', 'p'], ['Cycles', 'cyc'], ['Scanline', 'line'], ['Frame', 'frm']].forEach(([l, k]) => {
  const d = document.createElement('div'); d.className = 'reg'; const s = document.createElement('span'); s.textContent = l; const b = document.createElement('b');
  d.append(s, b); regsEl.appendChild(d); regCells[k] = b;
});
const flagEls = [...'NV-BDIZC'].map(c => { const i = document.createElement('i'); i.textContent = c; $('#flagrow').appendChild(i); return i; });
const tvCanvas = $('#tv'), tvCtx = tvCanvas.getContext('2d'), beam = $('#beam');
const tvImg = new ImageData(new Uint8ClampedArray(M.tia.fb.buffer), 160, 192);
let tvDirty = true;
function renderPanels() {
  setT(regCells.pc, '$' + hex4(disp.pc)); setT(regCells.a, '$' + hex2(disp.a)); setT(regCells.x, '$' + hex2(disp.x)); setT(regCells.y, '$' + hex2(disp.y));
  setT(regCells.s, '$' + hex2(disp.s)); setT(regCells.p, '$' + hex2(disp.p)); setT(regCells.cyc, String(M.cycles)); setT(regCells.line, String(M.tia.line)); setT(regCells.frm, String(M.tia.frame));
  for (let i = 0; i < 8; i++) setC(flagEls[i], 'on', (disp.p >> (7 - i)) & 1);
  if (tvDirty) { if (tvCtx) tvCtx.putImageData(tvImg, 0, 0); tvDirty = false; }
  const bx = M.tia.hpos - 68, by = M.tia.line - 40;
  if (bx >= 0 && by >= 0 && by < 192) { beam.style.display = ''; beam.style.left = (bx / 160 * 100) + '%'; beam.style.top = (by / 192 * 100) + '%'; } else beam.style.display = 'none';
}

/* ================= sequencer ================= */
const SPEEDS = [['Slow', 1500], ['Medium', 750], ['Quick', 300], ['Blur', 0], ['Real time', 0]];
const FADES = [700, 500, 350, 380, 260];
let level = 1, mode = 'paused', cur = null, phaseEnd = 0, pendSets = [], prevOn = null, lastFocus = '', lastNowT = 0;

function syncDisp() {
  disp.pc = M.pc; disp.a = M.a; disp.x = M.x; disp.y = M.y; disp.s = M.s; disp.p = M.p;
  disp.ram.set(M.ram); disp.tia.set(M.tia.reg);
}
function applySet(o) {
  for (const k in o) {
    if (k === 'ramw') disp.ram[o.ramw[0]] = o.ramw[1];
    else if (k === 'tiaw') disp.tia[o.tiaw[0]] = o.tiaw[1];
    else if (k === 'opinfo') { disp.op = cur.info; disp.mnem = cur.info.m + ' ' + MODE[cur.info.mode]; }
    else disp[k] = o[k];
  }
}
function processSets(now) {
  if (!pendSets.length) return;
  const rest = [];
  pendSets.forEach(s => { if (s.at <= now) applySet(s.o); else rest.push(s); });
  pendSets = rest;
}
function describeIns(info, bytes) {
  const o = A.OPS[info.op];
  if (!o) return '.byte $' + hex2(info.op);
  return o.m + ' ' + A.fmtOperand(o, bytes[1] || 0, bytes[2] || 0, info.pc);
}
function newInstruction(now, quiet) {
  M.tracing = true;
  const info = M.step(), tr = M.tr.slice(), phases = PH.buildPhases(info, tr), bytes = tr.filter(e => e.t === 'fetch').map(e => e.val);
  cur = { info, phases, idx: -1, bytes, text: '' };
  cur.text = describeIns(info, bytes).trim();
  if (!quiet || now - lastNowT > 200) { renderNow(); lastNowT = now; } else cur.ol = null;
  highlightPC(info.pc); tvDirty = true;
}
function finishInstruction(now) {
  pendSets.forEach(s => applySet(s.o)); pendSets = [];
  syncDisp();
  if (prevOn) { prevOn = null; }
  if (cur) highlightPC(M.pc);
}
function startPhase(now) {
  if (prevOn && mode === 'micro') prevOn.forEach(([id]) => { if (T[id] && T[id].end > now) T[id].end = now; });
  pendSets.forEach(s => applySet(s.o)); pendSets = [];
  const ph = cur.phases[++cur.idx], dur = Math.max(60, SPEEDS[level][1] * ph.dur);
  const hold = mode === 'micro';
  ph.on.forEach(([id, t, rev]) => schedule(id, now + t * dur, hold ? Infinity : now + dur, rev));
  prevOn = ph.on;
  pendSets = pendSets.concat(ph.sets.map(([t, o]) => ({ at: now + t * dur, o })));
  disp.tcyc = ph.cyc; phaseEnd = now + dur;
  markStep(cur.idx);
  if ($('#follow').checked && ph.focus !== lastFocus && LAY.VIEWS[ph.focus]) { lastFocus = ph.focus; flyTo(ph.focus); }
}
function advance(now) {
  if (!cur || cur.idx >= cur.phases.length - 1) { if (cur) finishInstruction(now); newInstruction(now); }
  startPhase(now);
}
function instant(now) {
  if (cur) finishInstruction(now);
  newInstruction(now, true);
  cur.phases.forEach(ph => { ph.on.forEach(([id, t, rev]) => schedule(id, now, now, rev)); ph.sets.forEach(([t, o]) => applySet(o)); disp.tcyc = ph.cyc; });
  pendSets = []; syncDisp();
  highlightPC(M.pc);
}
const CHIP_LIGHT = { rom: ['f_rom', 'rom_arr'], tia: ['f_tia', 'tia_regs', 'tia_gen'], ram: ['f_riot', 'riot_ram'], timer: ['f_riot', 'riot_timer'], io: ['f_riot', 'riot_io'] };
function realtime(now, dt) {
  M.tracing = false;
  if (!rtNote) { rtNote = true; nowBox.innerHTML = ''; const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Running at full speed: about 1.19 million CPU cycles per second, like the real console. Individual instructions go by too fast to follow, so the chips flash whenever they are accessed. Pause, or choose a slower speed, to watch single instructions.'; nowBox.appendChild(p); }
  const target = M.cycles + Math.min(dt, 50) * 1193.18, acc = { rom: 0, tia: 0, ram: 0, timer: 0, io: 0 };
  let guard = 0;
  while (M.cycles < target && guard++ < 80000) { M.step(); for (const k in acc) acc[k] += M.acc[k]; }
  syncDisp(); disp.romAddr = M.pc & 0xFFF; disp.ar = M.pc & 0x1FFF; disp.tcyc = 0; tvDirty = true;
  ['pc', 'ar', 'e_ar_pin', 'e_data_pin'].forEach(id => schedule(id, now, now + 40));
  for (const k in acc) if (acc[k]) CHIP_LIGHT[k].forEach(id => schedule(id, now, now + 40));
  highlightPC(M.pc);
}
function stopAll() { mode = 'paused'; updateButtons(); }
function resetMachine() {
  stopAll(); M.reset(); cur = null; pendSets = []; prevOn = null; phaseEnd = 0;
  clearLights(); syncDisp(); disp.ar = M.pc & 0x1FFF; disp.ir = undefined; disp.op = null; disp.mnem = ''; disp.tcyc = 0; disp.ain = disp.bin = disp.res = undefined;
  disp.binvtxt = ''; disp.logicop = ''; disp.shiftop = ''; disp.romAddr = M.pc & 0xFFF; disp.db = 0;
  M.tia.fb.fill(0xFF000000); tvDirty = true; renderNow(); highlightPC(M.pc);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(now - last, 100); last = now;
  stepCam(now);
  if (mode === 'run' || mode === 'step') {
    if (level <= 2) {
      if (now >= phaseEnd) {
        if (mode === 'step' && cur && cur.idx >= cur.phases.length - 1 && cur.started) { finishInstruction(now); mode = 'paused'; updateButtons(); }
        else { advance(now); cur.started = true; }
      }
    } else if (level === 3) { instant(now); if (mode === 'step') stopAll(); }
    else { if (mode === 'step') { instant(now); stopAll(); } else realtime(now, dt); }
  }
  processSets(now);
  updateLights(now, dt);
  updaters.forEach(f => f());
  renderPanels();
  requestAnimationFrame(frame);
}

/* ================= controls ================= */
const ICON = {
  play: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg>',
  pause: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2h3v10H3zM8 2h3v10H8z"/></svg>',
  step: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2v10l7-5zM10 2h2v10h-2z"/></svg>',
  micro: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 2v10l6-5z"/><circle cx="11.5" cy="7" r="1.6"/></svg>',
  reset: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5a5.5 5.5 0 1 0 5.5 5.5h-2A3.5 3.5 0 1 1 7 3.5V6l3.6-3.2L7 -.4z"/></svg>'
};
const bRun = $('#bRun'), bStep = $('#bStep'), bMicro = $('#bMicro'), bReset = $('#bReset');
function updateButtons() {
  const running = mode === 'run';
  bRun.innerHTML = (running ? ICON.pause : ICON.play) + '<span>' + (running ? 'Pause' : 'Run') + '</span>';
  bStep.innerHTML = ICON.step + '<span>Step</span>'; bMicro.innerHTML = ICON.micro + '<span>Micro-step</span>'; bReset.innerHTML = ICON.reset + '<span>Reset</span>';
}
bRun.addEventListener('click', () => {
  if (mode === 'run') { mode = 'paused'; }
  else { releaseLights(performance.now()); mode = 'run'; }
  updateButtons();
});
bStep.addEventListener('click', () => {
  const now = performance.now();
  if (level >= 3) { releaseLights(now); mode = 'step'; updateButtons(); return; }
  if (cur && cur.idx < cur.phases.length - 1) finishInstruction(now);
  releaseLights(now); cur = null; phaseEnd = 0; mode = 'step'; updateButtons();
});
bMicro.addEventListener('click', () => {
  const now = performance.now();
  if (mode !== 'micro') { mode = 'micro'; updateButtons(); }
  advance(now); cur.started = true;
});
bReset.addEventListener('click', resetMachine);
const speed = $('#speed'), speedOut = $('#speedOut');
function setLevel(v) {
  level = v; FADE = FADES[v]; speedOut.textContent = SPEEDS[v][0];
  if (v >= 4) { M.tracing = false; } else M.tracing = true;
}
speed.addEventListener('input', () => setLevel(+speed.value));

const demoSel = $('#demoSel'), src = $('#src');
DEMOS.forEach((d, i) => { const o = document.createElement('option'); o.value = i; o.textContent = d.name; demoSel.appendChild(o); });
function loadDemo(i) { const d = DEMOS[i]; src.value = d.src; $('#blurb').textContent = d.blurb; loadRomFromSource(d.src); }
demoSel.addEventListener('change', () => loadDemo(+demoSel.value));
$('#bAsm').addEventListener('click', () => loadRomFromSource(src.value));

/* ================= start ================= */
updateButtons(); setLevel(1);
loadDemo(0);
showDefaultPart();
renderNow();
applyCam(); flyTo('sys', true);
requestAnimationFrame(frame);
window.__explorer = { setDieMode, M, disp, get cur() { return cur; }, get mode() { return mode; }, flyTo, REG, T, setLevel };
})();
</script>
